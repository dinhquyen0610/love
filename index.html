<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>For You ✨</title>
<style>
  :root{
    --bg:#010204;
    --white:#fdfdfd;
    --soft:rgba(255,255,255,.75);
    --muted:rgba(255,255,255,.22);
    --pink:#ffd8e7;
    --pink2:#ffb8d0;
    --gold:#fff1c6;
    --blue:#dff6ff;
    --violet:#f3ddff;
  }

  *{box-sizing:border-box;margin:0;padding:0}
  html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:var(--bg);
  }
  body{
    font-family: Inter, "SF Pro Display", system-ui, -apple-system, sans-serif;
    color:#fff;
  }

  canvas{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    display:block;
  }
  #stars{z-index:0}
  #fx{z-index:1;pointer-events:none}

  .space-glow{
    position:fixed;
    inset:0;
    z-index:2;
    pointer-events:none;
    background:
      radial-gradient(circle at 50% 50%, rgba(255,120,170,.12), transparent 18%),
      radial-gradient(circle at 30% 35%, rgba(170,220,255,.06), transparent 20%),
      radial-gradient(circle at 75% 65%, rgba(255,235,180,.05), transparent 18%),
      radial-gradient(circle at center, transparent 56%, rgba(0,0,0,.15) 82%, rgba(0,0,0,.36));
  }

  .frame{
    position:fixed;
    inset:20px;
    z-index:3;
    border:1px solid rgba(255,255,255,.06);
    border-radius:28px;
    pointer-events:none;
    box-shadow:
      inset 0 0 0 1px rgba(255,255,255,.02),
      0 0 80px rgba(0,0,0,.38);
    overflow:hidden;
  }
  .frame::before{
    content:"";
    position:absolute;
    inset:14px;
    border:1px solid rgba(255,255,255,.03);
    border-radius:22px;
  }
  .frame::after{
    content:"";
    position:absolute;
    left:50%;
    top:50%;
    width:min(62vw,720px);
    height:min(62vw,720px);
    transform:translate(-50%,-50%);
    border-radius:50%;
    border:1px solid rgba(255,255,255,.025);
    box-shadow:
      0 0 90px rgba(255,145,185,.08),
      inset 0 0 40px rgba(180,220,255,.03);
    opacity:.65;
  }

  .hud{
    position:fixed;
    top:22px;
    left:50%;
    transform:translateX(-50%);
    z-index:8;
    text-align:center;
    pointer-events:none;
  }
  .badge{
    display:inline-block;
    padding:8px 14px;
    border-radius:999px;
    border:1px solid rgba(255,255,255,.08);
    background:rgba(255,255,255,.04);
    backdrop-filter: blur(10px);
    font:600 11px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
    letter-spacing:.12em;
    text-transform:uppercase;
    color:rgba(255,255,255,.48);
  }
  .sub{
    margin-top:8px;
    font:500 10px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;
    color:rgba(255,255,255,.20);
    letter-spacing:.05em;
  }

  .scene{
    position:fixed;
    inset:0;
    z-index:5;
    perspective:1600px;
    perspective-origin:50% 50%;
    overflow:hidden;
  }
  .world{
    position:absolute;
    left:50%;
    top:50%;
    width:0;
    height:0;
    transform-style:preserve-3d;
    will-change:transform;
  }

  .quote{
    position:absolute;
    left:0;
    top:0;
    white-space:nowrap;
    transform-style:preserve-3d;
    font-style:italic;
    font-weight:700;
    letter-spacing:-.03em;
    line-height:1.1;
    opacity:.96;
    will-change:transform, opacity, filter;
    text-shadow:
      0 0 4px rgba(255,255,255,.78),
      0 0 12px rgba(255,255,255,.28),
      0 0 28px rgba(255,160,190,.24);
  }
  .quote.white{color:rgba(255,255,255,.96)}
  .quote.pink{color:var(--pink)}
  .quote.gold{color:var(--gold)}
  .quote.blue{color:var(--blue)}
  .quote.violet{color:var(--violet)}

  .final-wrap{
    position:fixed;
    inset:0;
    z-index:7;
    display:flex;
    align-items:center;
    justify-content:center;
    pointer-events:none;
    opacity:0;
    transform:scale(.98);
    transition:opacity 1.2s ease, transform 1.2s ease;
  }
  .final-wrap.show{
    opacity:1;
    transform:scale(1);
  }
  .final-card{
    text-align:center;
    max-width:min(88vw,900px);
    padding:24px 24px;
  }
  .final-top{
    font:500 11px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;
    color:rgba(255,255,255,.30);
    letter-spacing:.14em;
    text-transform:uppercase;
    margin-bottom:14px;
  }
  .final-line{
    font-size:clamp(20px, 4vw, 42px);
    line-height:1.4;
    font-style:italic;
    font-weight:500;
    letter-spacing:-.02em;
    color:rgba(255,255,255,.95);
    text-shadow:
      0 0 8px rgba(255,255,255,.32),
      0 0 28px rgba(255,180,205,.18);
  }
  .final-line strong{
    font-weight:700;
    color:#fff4f8;
  }
  .final-small{
    margin-top:16px;
    font-size:clamp(12px, 1.6vw, 14px);
    color:rgba(255,255,255,.42);
    letter-spacing:.02em;
  }

  .footer{
    position:fixed;
    bottom:16px;
    left:50%;
    transform:translateX(-50%);
    z-index:8;
    display:flex;
    align-items:center;
    gap:10px;
    padding:8px 12px;
    border-radius:999px;
    border:1px solid rgba(255,255,255,.06);
    background:rgba(255,255,255,.03);
    backdrop-filter: blur(8px);
    font:500 10px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
    color:rgba(255,255,255,.22);
    letter-spacing:.04em;
  }
  .footer .dot{
    width:4px;height:4px;border-radius:50%;
    background:rgba(255,255,255,.24);
  }

  @media (max-width:700px){
    .frame{ inset:12px; border-radius:22px; }
    .frame::before{ inset:10px; border-radius:16px; }
    .quote{ white-space:normal; max-width:72vw; text-align:center; }
    .badge{ font-size:10px; }
    .sub{ font-size:9px; }
    .footer{ bottom:10px; font-size:9px; padding:7px 10px; }
  }
</style>
</head>
<body>
<canvas id="stars"></canvas>
<canvas id="fx"></canvas>
<div class="space-glow"></div>
<div class="frame"></div>

<!-- <div class="hud">
  <div class="badge">text galaxy // orbit sequence</div>
  <div class="sub">fast orbit → gather → one final line</div>
</div> -->

<div class="scene">
  <div class="world" id="world"></div>
</div>

<div class="final-wrap" id="finalWrap">
  <div class="final-card">
    <!-- <div class="final-top">final message</div> -->
    <div class="final-line">
      I think I’d like to know you a little better —<br />
      <strong>maybe over coffee, sometime.</strong> ❤️
    </div>
    <!-- <div class="final-small">just a simple thought, softly said.</div> -->
  </div>
</div>

<div class="footer">
  <!-- <span>black sky</span>
  <span class="dot"></span>
  <span>glowing stars</span> -->
  <!-- <span class="dot"></span> -->
  <span>Made by Quyền Nguyễn</span>
</div>

<script>
/* ===============================
   QUOTES
================================== */
const quotesData = [
  "Gặp em là điều tuyệt vời mà anh không ngờ tới.",
  "Chỉ cần em gật đầu, anh sẽ đến bên em ngay.",
  "Em là giấc mơ mà anh không muốn tỉnh dậy.",
  "Mỗi lần nhìn em, tim anh lại loạn nhịp.",
  "Somewhere between all these words, I found you.",
  "I think I'd like to know you a little better.",
  "Maybe over coffee, sometime. ❤️",
  "Anh không cần điều gì nhiều, chỉ cần em.",
  "Em chính là định mệnh của đời anh.",
  "Từ khi có em, thế giới anh rực rỡ hẳn lên.",
  "Chúng ta sinh ra là để dành cho nhau.",
  "Trái tim anh chỉ thuộc về em.",
  "Nụ cười của em là lý do đẹp nhất của ngày hôm nay.",
  "You make ordinary days feel softer.",
  "With you, even silence feels warm.",
  "You're my favorite unexpected thought.",
  "I didn't plan this. Then I met you.",
  "Your presence feels like good news.",
  "I hope you know how lovely you are.",
  "Not a confession. Just something true."
];
const colors = ["white","pink","gold","blue","violet"];
const world = document.getElementById("world");
const finalWrap = document.getElementById("finalWrap");

const items = [];
const rings = [
  {radiusX: 760, radiusZ: 540, yBase: -200, speed: 0.26, phase: 0.0},
  {radiusX: 980, radiusZ: 720, yBase: 40, speed: -0.19, phase: 1.25},
  {radiusX: 1220, radiusZ: 940, yBase: 280, speed: 0.145, phase: 2.2},
];

quotesData.forEach((text, i) => {
  const ringIndex = i % rings.length;
  const ring = rings[ringIndex];
  const slot = Math.floor(i / rings.length);
  const slotsCount = Math.ceil(quotesData.length / rings.length);
  const baseAngle = (slot / slotsCount) * Math.PI * 2 + ring.phase;
  const size = i < 4 ? 28 + Math.random()*12 : 15 + Math.random()*12;

  const el = document.createElement("div");
  el.className = `quote ${colors[i % colors.length]}`;
  el.textContent = text;
  el.style.fontSize = size + "px";
  world.appendChild(el);

  items.push({
    el,
    text,
    ringIndex,
    angle: baseAngle,
    baseAngle,
    size,
    baseScale: .78 + Math.random()*.45,
    rx: -7 + Math.random()*14,
    ryBase: -18 + Math.random()*36,
    floatPhase: Math.random()*Math.PI*2,
    gatherX: 0,
    gatherY: 0,
    gatherZ: 0
  });
});

/* ===============================
   CAMERA
================================== */
let rotationX = -13;
let rotationY = 18;
let zoom = -960;
function updateWorld(){
  world.style.transform = `
    translate3d(0,0,0)
    translateZ(${zoom}px)
    rotateX(${rotationX}deg)
    rotateY(${rotationY}deg)
  `;
}
updateWorld();

/* ===============================
   TIMELINE
================================== */
const totalDuration = 12000;   // full sequence
const orbitDuration = 7000;    // fast orbit stage
const gatherDuration = 3000;   // gather stage
const finalFadeStart = 9800;   // show final line near the end
const startAt = performance.now();

function easeOutCubic(t){ return 1 - Math.pow(1 - t, 3); }
function easeInOutCubic(t){ return t < .5 ? 4*t*t*t : 1 - Math.pow(-2*t + 2, 3)/2; }
function lerp(a,b,t){ return a + (b-a)*t; }

/* ===============================
   RENDER QUOTES
================================== */
function renderScene(now){
  const elapsed = now - startAt;
  const tOrbit = Math.min(1, elapsed / orbitDuration);
  const gatherStart = orbitDuration;
  const tGatherRaw = (elapsed - gatherStart) / gatherDuration;
  const tGather = Math.max(0, Math.min(1, tGatherRaw));
  const gatherEase = easeInOutCubic(tGather);

  // camera soft drift in the first phase
  if(elapsed < orbitDuration){
    rotationY = 18 + Math.sin(now * 0.00032) * 4.6;
    rotationX = -13 + Math.cos(now * 0.00027) * 2.3;
    zoom = -960 + Math.sin(now * 0.00018) * 24;
  } else {
    rotationY = lerp(rotationY, 8, 0.04);
    rotationX = lerp(rotationX, -8, 0.04);
    zoom = lerp(zoom, -760, 0.05);
  }

  updateWorld();

  items.forEach((item, i) => {
    const ring = rings[item.ringIndex];
    const phaseTime = now * 0.001;

    // Fast orbiting angle
    const a = item.baseAngle + phaseTime * ring.speed;

    const orbitX = Math.cos(a) * ring.radiusX;
    const orbitZ = Math.sin(a) * ring.radiusZ;
    const orbitY = ring.yBase
      + Math.sin(a * 2 + item.floatPhase) * 90
      + Math.sin(phaseTime * 1.25 + i) * 12;

    // final gather positions arranged around center then to exact center sentence
    // scatter around center to create a nice collapsing feel
    const layer = i % 5;
    const gx = (layer - 2) * 22 + ((i % 2) ? 10 : -10);
    const gy = (Math.floor(i / 5) - 2) * 18;
    const gz = -120 + (i % 7) * 10;

    const x = lerp(orbitX, gx, gatherEase);
    const y = lerp(orbitY, gy, gatherEase);
    const z = lerp(orbitZ, gz, gatherEase);

    const depthNorm = (Math.sin(a) + 1) / 2;
    const orbitScale = item.baseScale * (0.78 + depthNorm * 0.44);
    const scale = lerp(orbitScale, 0.84, gatherEase);

    const tangentY = -Math.sin(a) * 24;
    const bankX = Math.cos(a) * 5.5;

    const rx = lerp(item.rx + bankX, 0, gatherEase);
    const ry = lerp(item.ryBase + tangentY, 0, gatherEase);

    const opacityOrbit = 0.35 + depthNorm * 0.65;
    const opacity = elapsed < orbitDuration
      ? opacityOrbit
      : lerp(opacityOrbit, 0, gatherEase);

    const blur = elapsed < orbitDuration
      ? (1 - depthNorm) * 0.65
      : lerp((1 - depthNorm) * 0.65, 1.4, gatherEase);

    item.el.style.opacity = opacity.toFixed(3);
    item.el.style.filter = `blur(${blur}px)`;
    item.el.style.transform = `
      translate3d(${x}px, ${y}px, ${z}px)
      rotateX(${rx}deg)
      rotateY(${ry}deg)
      scale(${scale})
    `;
  });

  if(elapsed > finalFadeStart){
    finalWrap.classList.add("show");
  }

  requestAnimationFrame(renderScene);
}
requestAnimationFrame(renderScene);

/* ===============================
   STARS & FX
================================== */
const starsCanvas = document.getElementById("stars");
const fxCanvas = document.getElementById("fx");
const sctx = starsCanvas.getContext("2d");
const fctx = fxCanvas.getContext("2d");

let W=0, H=0, DPR=1;
let stars = [];
let shootingStars = [];
let sparkles = [];
let flareParticles = [];
let burstDone = false;

function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = innerWidth;
  H = innerHeight;
  [starsCanvas, fxCanvas].forEach(c => {
    c.width = W * DPR;
    c.height = H * DPR;
    c.style.width = W + "px";
    c.style.height = H + "px";
  });
  sctx.setTransform(DPR,0,0,DPR,0,0);
  fctx.setTransform(DPR,0,0,DPR,0,0);
  createStars();
}
window.addEventListener("resize", resize);

function createStars(){
  stars = [];
  const count = W < 700 ? 170 : 270;
  for(let i=0;i<count;i++){
    stars.push({
      x: Math.random() * W,
      y: Math.random() * H,
      r: Math.random() * 1.5 + 0.25,
      a: Math.random() * 0.78 + 0.12,
      p: Math.random() * Math.PI * 2,
      s: Math.random() * 0.018 + 0.005
    });
  }

  sparkles = [];
  const count2 = W < 700 ? 22 : 34;
  for(let i=0;i<count2;i++){
    sparkles.push(newSparkle(true));
  }
}

function newSparkle(initial=false){
  return {
    x: Math.random() * W,
    y: initial ? Math.random() * H : H + 20,
    size: Math.random() * 2 + 1,
    alpha: Math.random() * 0.45 + 0.18,
    vy: Math.random() * 0.25 + 0.08,
    drift: (Math.random()-.5) * 0.18,
    phase: Math.random() * Math.PI * 2
  };
}

function spawnFinalBurst(){
  burstDone = true;
  const cx = W / 2;
  const cy = H / 2;
  for(let i=0;i<90;i++){
    const a = Math.random() * Math.PI * 2;
    const speed = 1.2 + Math.random() * 3.2;
    flareParticles.push({
      x: cx,
      y: cy,
      vx: Math.cos(a) * speed,
      vy: Math.sin(a) * speed,
      life: 1,
      size: Math.random() * 2.6 + 0.8
    });
  }
}

function drawStars(t){
  sctx.clearRect(0,0,W,H);

  const bg = sctx.createRadialGradient(W/2,H/2,0,W/2,H/2,Math.max(W,H)*0.65);
  bg.addColorStop(0, "rgba(255,130,175,.06)");
  bg.addColorStop(1, "rgba(0,0,0,0)");
  sctx.fillStyle = bg;
  sctx.fillRect(0,0,W,H);

  for(const st of stars){
    const tw = .58 + .42 * Math.sin(t * st.s + st.p);
    sctx.beginPath();
    sctx.arc(st.x, st.y, st.r, 0, Math.PI*2);
    sctx.fillStyle = `rgba(255,255,255,${st.a * tw})`;
    sctx.shadowBlur = st.r * 7;
    sctx.shadowColor = "rgba(255,255,255,.6)";
    sctx.fill();
    sctx.shadowBlur = 0;
  }

  if(Math.random() > 0.988){
    shootingStars.push({
      x: Math.random() * W * 0.78,
      y: Math.random() * H * 0.36,
      vx: 6 + Math.random() * 5,
      vy: 2 + Math.random() * 3.5,
      life: 1
    });
  }

  for(let i=shootingStars.length-1;i>=0;i--){
    const s = shootingStars[i];
    sctx.beginPath();
    sctx.moveTo(s.x, s.y);
    sctx.lineTo(s.x - s.vx * 12, s.y - s.vy * 12);
    sctx.strokeStyle = `rgba(255,255,255,${s.life})`;
    sctx.lineWidth = 1;
    sctx.stroke();

    s.x += s.vx;
    s.y += s.vy;
    s.life -= .026;
    if(s.life <= 0) shootingStars.splice(i,1);
  }
}

function drawFX(now){
  fctx.clearRect(0,0,W,H);

  for(let i=0;i<sparkles.length;i++){
    const p = sparkles[i];
    p.y -= p.vy;
    p.x += Math.sin(now*0.001 + p.phase) * p.drift * 3;
    if(p.y < -20) sparkles[i] = newSparkle(false);

    const tw = .55 + .45 * Math.sin(now*0.002 + p.phase);
    fctx.beginPath();
    fctx.arc(p.x, p.y, p.size, 0, Math.PI*2);
    fctx.fillStyle = `rgba(255,228,238,${p.alpha * tw})`;
    fctx.shadowBlur = 14;
    fctx.shadowColor = "rgba(255,180,205,.6)";
    fctx.fill();
    fctx.shadowBlur = 0;
  }

  // final burst when the final line appears
  if(!burstDone && now - startAt > finalFadeStart + 200){
    spawnFinalBurst();
  }

  for(let i=flareParticles.length-1;i>=0;i--){
    const p = flareParticles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.vx *= .985;
    p.vy *= .985;
    p.life -= .014;

    fctx.beginPath();
    fctx.arc(p.x, p.y, p.size, 0, Math.PI*2);
    fctx.fillStyle = `rgba(255,245,250,${p.life})`;
    fctx.shadowBlur = 18;
    fctx.shadowColor = "rgba(255,210,225,.8)";
    fctx.fill();
    fctx.shadowBlur = 0;

    if(p.life <= 0){
      flareParticles.splice(i,1);
    }
  }

  // subtle center star flare after final appears
  if(now - startAt > finalFadeStart){
    const k = (now - (startAt + finalFadeStart)) / 1200;
    const alpha = Math.max(0, .34 - k * .18);
    const cx = W/2;
    const cy = H/2;

    const grad = fctx.createRadialGradient(cx,cy,0,cx,cy,180);
    grad.addColorStop(0, `rgba(255,255,255,${alpha})`);
    grad.addColorStop(.18, `rgba(255,220,235,${alpha*.55})`);
    grad.addColorStop(1, "rgba(255,220,235,0)");
    fctx.fillStyle = grad;
    fctx.fillRect(cx-200, cy-200, 400, 400);
  }
}

function animateStars(now){
  drawStars(now);
  drawFX(now);
  requestAnimationFrame(animateStars);
}

resize();
requestAnimationFrame(animateStars);
</script>
</body>
</html>
